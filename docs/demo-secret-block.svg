<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="760" height="330" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="760" height="330" rx="10" fill="#1e1e2e"/>
    <rect width="760" height="34" fill="#181825"/>
    <circle cx="20" cy="17" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="17" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="17" r="6" fill="#a6e3a1"/>
    <text x="380" y="21" fill="#6c7086" text-anchor="middle" font-size="12">claude — session</text>

    <text x="24" y="62" fill="#89b4fa">●</text>
    <text x="40" y="62" fill="#cdd6f4">Claude wants to write <tspan fill="#f9e2af">config.ts</tspan>:</text>
    <text x="40" y="84" fill="#6c7086">export const key = "sk-ant-api03-••••••••••••••••";</text>

    <text x="24" y="122" fill="#f38ba8" font-weight="bold">✗ PreToolUse:Write hook blocked this action</text>

    <text x="40" y="150" fill="#f38ba8">[Hook] BLOCKED: possible secret in config.ts:</text>
    <text x="40" y="170" fill="#f38ba8">       Anthropic API key (line 1)</text>
    <text x="40" y="196" fill="#a6e3a1">[Hook] Use environment variables instead</text>
    <text x="40" y="216" fill="#a6e3a1">       (e.g. process.env.MY_KEY); never commit literals.</text>

    <text x="24" y="254" fill="#89b4fa">●</text>
    <text x="40" y="254" fill="#cdd6f4">Claude rewrites it safely:</text>
    <text x="40" y="276" fill="#a6e3a1">export const key = process.env.ANTHROPIC_API_KEY;</text>

    <text x="24" y="308" fill="#6c7086" font-size="11">deterministic · runs before the file touches disk · 0 model tokens</text>
  </g>
</svg>
